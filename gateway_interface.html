<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gateway Relay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #12141c;
    --panel: #1b1e2b;
    --panel-raised: #232739;
    --border: #2c3145;
    --signal: #ffb86b;
    --relay: #6c8ef5;
    --text: #e8e6e1;
    --muted: #8b8fa3;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    overflow-x: hidden;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* ---------- Sidebar (Menü, angelehnt an die Claude-App) ---------- */
  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 86%;
    max-width: 340px;
    background: var(--ink);
    border-right: 1px solid var(--border);
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    z-index: 30;
    display: flex;
    flex-direction: column;
    padding: 22px 0 0;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 26px;
    padding: 0 20px 20px;
  }
  .sidebar-title span { color: var(--signal); }
  .sidebar-section { padding: 0 12px; }
  .sidebar-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 10px;
    border-radius: 10px;
    font-size: 15px;
    color: var(--text);
    cursor: pointer;
  }
  .sidebar-link:hover { background: var(--panel-raised); }
  .sidebar-divider { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .sidebar-label {
    font-size: 12px;
    color: var(--muted);
    padding: 6px 14px;
    text-transform: none;
  }
  .chat-list { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; padding: 0 12px; }
  .chat-item {
    padding: 11px 12px;
    border-radius: 10px;
    font-size: 14.5px;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat-item.active { background: var(--panel-raised); color: var(--text); }
  .chat-item:hover { background: var(--panel-raised); }
  .sidebar-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 16px;
    border-top: 1px solid var(--border);
  }
  .avatar-circle {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    flex-shrink: 0;
  }
  .new-chat-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--signal);
    color: #1a1305;
    border: none;
    border-radius: 20px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Space Grotesk', sans-serif;
    cursor: pointer;
  }

  .backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 20;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }

  /* ---------- Header ---------- */
  header { padding: 18px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  .menu-btn, .icon-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 40px;
    height: 40px;
    font-size: 16px;
    cursor: pointer;
    color: var(--text);
    flex-shrink: 0;
    transition: all 0.15s ease;
  }
  .menu-btn:active, .icon-btn:active { transform: scale(0.94); }
  .icon-btn[aria-pressed="true"] { background: var(--signal); border-color: var(--signal); }
  .title-block { flex: 1; min-width: 0; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    margin: 0 0 3px;
  }
  h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  h1 span { color: var(--signal); }
  .header-actions { display: flex; gap: 8px; flex-shrink: 0; }
  input[type=file] { display: none; }

  /* ---------- Relay rail ---------- */
  .rail-wrap { padding: 22px 20px 6px; max-width: 720px; margin: 0 auto; }
  .rail { position: relative; display: flex; justify-content: space-between; align-items: center; height: 2px; background: var(--border); margin: 38px 0 12px; }
  .node { position: relative; width: 13px; height: 13px; border-radius: 50%; background: var(--panel-raised); border: 2px solid var(--border); transition: all 0.4s ease; }
  .node .label { position: absolute; top: 17px; left: 50%; transform: translateX(-50%); font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  .node.active { background: var(--signal); border-color: var(--signal); box-shadow: 0 0 0 6px rgba(255, 184, 107, 0.15); }
  .node.skipped { border-color: var(--danger); opacity: 0.4; }
  .pulse { position: absolute; top: -3.5px; left: 0; width: 9px; height: 9px; border-radius: 50%; background: var(--relay); opacity: 0; }
  .pulse.run { animation: travel 1.1s ease-in-out; }
  @keyframes travel { 0% { left: 0%; opacity: 1; } 100% { left: calc(100% - 9px); opacity: 1; } }
  .rail-status { text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--muted); min-height: 16px; }

  main { max-width: 720px; margin: 0 auto; padding: 8px 16px 120px; }

  .config { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 18px; }
  .config summary { cursor: pointer; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .config-fields { display: grid; gap: 10px; margin-top: 14px; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  input[type=text], input[type=password], select {
    width: 100%;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 11px;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }
  input:focus, textarea:focus, button:focus, select:focus { outline: 2px solid var(--relay); outline-offset: 1px; }

  .log { display: flex; flex-direction: column; gap: 16px; min-height: 160px; margin-bottom: 16px; }
  .msg { padding: 13px 15px; border-radius: 14px; max-width: 90%; line-height: 1.55; font-size: 14.5px; white-space: pre-wrap; }
  .msg.user { background: var(--panel-raised); align-self: flex-end; border: 1px solid var(--border); border-bottom-right-radius: 4px; }
  .msg.ai { background: var(--panel); align-self: flex-start; border-left: 2px solid var(--signal); border-bottom-left-radius: 4px; }
  .msg .tag { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.05em; text-transform: uppercase; }
  .msg.error { border-left-color: var(--danger); }
  .msg-actions { display: flex; gap: 4px; margin-top: 10px; flex-wrap: wrap; }
  .msg-actions button {
    display: flex; align-items: center; gap: 4px;
    background: transparent;
    border: none;
    border-radius: 6px;
    color: var(--muted);
    font-size: 12px;
    padding: 5px 8px;
    cursor: pointer;
  }
  .msg-actions button:hover { color: var(--text); background: var(--panel-raised); }

  /* ---------- Composer (fixiert unten, wie eine App) ---------- */
  .composer-wrap {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, transparent, var(--ink) 30%);
    padding: 16px;
    z-index: 10;
  }
  .composer {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 6px 6px 16px;
  }
  textarea {
    flex: 1; resize: none;
    background: transparent;
    border: none;
    padding: 10px 0;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14.5px;
    min-height: 24px;
    max-height: 120px;
  }
  textarea:focus { outline: none; }
  button.mic {
    background: transparent;
    border: none;
    width: 40px; height: 40px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    color: var(--text);
    flex-shrink: 0;
  }
  button.mic.recording { background: var(--danger); color: #2a0a0a; }
  button.send {
    background: var(--signal);
    color: #1a1305;
    border: none;
    border-radius: 50%;
    width: 40px; height: 40px;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
    transition: filter 0.15s ease;
  }
  button.send:hover { filter: brightness(1.08); }
  button.send:disabled { opacity: 0.4; cursor: not-allowed; }

  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 50px 0; }
</style>
</head>
<body>

<div class="backdrop" id="backdrop"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-title">Gateway<span>.</span>Relay</div>
  <div class="sidebar-section">
    <div class="sidebar-link">💬&nbsp;&nbsp;Chats</div>
  </div>
  <hr class="sidebar-divider">
  <p class="sidebar-label">Zuletzt verwendet</p>
  <div class="chat-list" id="chatList"></div>
  <div class="sidebar-bottom">
    <div class="avatar-circle">A</div>
    <button class="new-chat-btn" id="addChat">＋ Neuer Chat</button>
  </div>
</aside>

<header>
  <button class="menu-btn" id="menuBtn">☰</button>
  <div class="title-block">
    <p class="eyebrow">Eigenes Gateway</p>
    <h1>Gateway<span>.</span>Relay</h1>
  </div>
  <div class="header-actions">
    <button id="voiceToggle" class="icon-btn" aria-pressed="false" title="Antworten automatisch vorlesen">🔇</button>
    <button id="downloadBtn" class="icon-btn" title="Alle Chats herunterladen">⬇️</button>
    <button id="uploadBtn" class="icon-btn" title="Chats hochladen">⬆️</button>
    <input type="file" id="uploadInput" accept="application/json">
  </div>
</header>

<div class="rail-wrap">
  <div class="rail" id="rail">
    <div class="pulse" id="pulse"></div>
    <div class="node" id="node-gemini"><span class="label">Gemini</span></div>
    <div class="node" id="node-groq"><span class="label">Groq</span></div>
    <div class="node" id="node-openrouter"><span class="label">OpenRouter</span></div>
  </div>
  <p class="rail-status" id="railStatus">Bereit</p>
</div>

<main>
  <details class="config">
    <summary>Verbindung einrichten</summary>
    <div class="config-fields">
      <div>
        <label for="baseUrl">Gateway-URL (deine Render-Adresse)</label>
        <input type="text" id="baseUrl" placeholder="https://dein-gateway.onrender.com">
      </div>
      <div>
        <label for="apiKey">Dein API-Key</label>
        <input type="password" id="apiKey" placeholder="owner- oder free-tier Key">
      </div>
      <div>
        <label for="chatPath">Chat-Endpunkt</label>
        <input type="text" id="chatPath" value="/chat">
      </div>
      <div>
        <label for="voiceSelect">Stimme für Vorlesen</label>
        <select id="voiceSelect"><option>Lädt Stimmen…</option></select>
      </div>
    </div>
  </details>

  <div class="log" id="log"></div>
</main>

<div class="composer-wrap">
  <div class="composer">
    <button class="mic" id="micBtn" title="Einsprechen">🎤</button>
    <textarea id="input" placeholder="Frag dein Gateway etwas…" rows="1"></textarea>
    <button class="send" id="sendBtn" title="Senden">➤</button>
  </div>
</div>

<script>
  // ---------- Sidebar / Chats ----------
  let conversations = [{ id: 'c1', title: 'Chat 1', history: [] }];
  let activeId = 'c1';
  function activeConv() { return conversations.find(c => c.id === activeId); }

  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('backdrop');
  const menuBtn = document.getElementById('menuBtn');

  function openSidebar() { sidebar.classList.add('open'); backdrop.classList.add('open'); }
  function shutSidebar() { sidebar.classList.remove('open'); backdrop.classList.remove('open'); }
  menuBtn.addEventListener('click', openSidebar);
  backdrop.addEventListener('click', shutSidebar);

  function renderChatList() {
    const listEl = document.getElementById('chatList');
    listEl.innerHTML = '';
    conversations.forEach(c => {
      const item = document.createElement('div');
      item.className = 'chat-item' + (c.id === activeId ? ' active' : '');
      item.textContent = c.title;
      item.addEventListener('click', () => { activeId = c.id; renderChatList(); renderLog(); shutSidebar(); });
      listEl.appendChild(item);
    });
  }

  document.getElementById('addChat').addEventListener('click', () => {
    const n = conversations.length + 1;
    const newConv = { id: 'c' + Date.now(), title: 'Chat ' + n, history: [] };
    conversations.push(newConv);
    activeId = newConv.id;
    renderChatList();
    renderLog();
    shutSidebar();
  });

  // ---------- Markdown vor dem Vorlesen entfernen ----------
  function stripMarkdown(text) {
    return text
      .replace(/```[\s\S]*?```/g, ' Code-Block ')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/\*\*(.*?)\*\*/g, '$1')
      .replace(/\*(.*?)\*/g, '$1')
      .replace(/__(.*?)__/g, '$1')
      .replace(/_(.*?)_/g, '$1')
      .replace(/#{1,6}\s?/g, '')
      .replace(/^\s*[-*+]\s+/gm, '')
      .replace(/\[(.*?)\]\(.*?\)/g, '$1')
      .trim();
  }

  // ---------- Sprachausgabe ----------
  let voiceEnabled = false;
  const voiceToggle = document.getElementById('voiceToggle');
  const voiceSelect = document.getElementById('voiceSelect');
  const synth = window.speechSynthesis;
  let chosenVoice = null;

  function loadVoices() {
    const voices = synth ? synth.getVoices() : [];
    const german = voices.filter(v => v.lang.startsWith('de'));
    const list = german.length ? german : voices;
    voiceSelect.innerHTML = '';
    list.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.name;
      opt.textContent = v.name + ' (' + v.lang + ')';
      voiceSelect.appendChild(opt);
    });
    const preferred = list.find(v => /Google|Microsoft|Natural/i.test(v.name)) || list[0];
    if (preferred) { chosenVoice = preferred; voiceSelect.value = preferred.name; }
  }
  if (synth) { synth.onvoiceschanged = loadVoices; loadVoices(); }
  voiceSelect.addEventListener('change', () => {
    const voices = synth.getVoices();
    chosenVoice = voices.find(v => v.name === voiceSelect.value) || null;
  });

  function speak(rawText) {
    if (!synth) return;
    synth.cancel();
    const utter = new SpeechSynthesisUtterance(stripMarkdown(rawText));
    utter.lang = 'de-DE';
    if (chosenVoice) utter.voice = chosenVoice;
    synth.speak(utter);
  }

  voiceToggle.addEventListener('click', () => {
    voiceEnabled = !voiceEnabled;
    voiceToggle.setAttribute('aria-pressed', String(voiceEnabled));
    voiceToggle.textContent = voiceEnabled ? '🔊' : '🔇';
    if (!voiceEnabled && synth) synth.cancel();
  });

  // ---------- Spracheingabe ----------
  const micBtn = document.getElementById('micBtn');
  const inputEl = document.getElementById('input');
  const railStatus = document.getElementById('railStatus');
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizer = null, recording = false;

  if (SpeechRecognitionCtor) {
    recognizer = new SpeechRecognitionCtor();
    recognizer.lang = 'de-DE';
    recognizer.interimResults = false;
    recognizer.continuous = false;
    recognizer.onresult = (e) => {
      const said = e.results[0][0].transcript;
      inputEl.value = (inputEl.value ? inputEl.value + ' ' : '') + said;
    };
    recognizer.onend = () => { recording = false; micBtn.classList.remove('recording'); };
    recognizer.onerror = () => { recording = false; micBtn.classList.remove('recording'); };
    micBtn.addEventListener('click', () => {
      if (recording) { recognizer.stop(); return; }
      recording = true; micBtn.classList.add('recording'); recognizer.start();
    });
  } else {
    micBtn.addEventListener('click', () => {
      railStatus.textContent = 'Spracheingabe wird von diesem Browser nicht unterstützt.';
    });
  }

  // ---------- Download / Upload ----------
  document.getElementById('downloadBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(conversations, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'gateway-chats.json'; a.click();
    URL.revokeObjectURL(url);
  });
  const uploadInput = document.getElementById('uploadInput');
  document.getElementById('uploadBtn').addEventListener('click', () => uploadInput.click());
  uploadInput.addEventListener('change', async () => {
    const file = uploadInput.files[0];
    if (!file) return;
    try {
      const parsed = JSON.parse(await file.text());
      if (!Array.isArray(parsed)) throw new Error('Ungültiges Format');
      conversations = parsed;
      activeId = conversations[0]?.id || 'c1';
      renderChatList(); renderLog();
      railStatus.textContent = 'Chats erfolgreich geladen.';
    } catch (err) {
      railStatus.textContent = 'Datei konnte nicht gelesen werden: ' + err.message;
    }
    uploadInput.value = '';
  });

  // ---------- Relay ----------
  const pulse = document.getElementById('pulse');
  const nodes = {
    gemini: document.getElementById('node-gemini'),
    groq: document.getElementById('node-groq'),
    openrouter: document.getElementById('node-openrouter'),
  };
  function resetRail() { Object.values(nodes).forEach(n => n.classList.remove('active', 'skipped')); }
  function markProvider(provider, order) {
    resetRail();
    for (const p of order) {
      if (p === provider) { nodes[p].classList.add('active'); break; }
      nodes[p].classList.add('skipped');
    }
  }

  // ---------- Log rendern ----------
  const logEl = document.getElementById('log');
  function renderLog() {
    const conv = activeConv();
    logEl.innerHTML = '';
    if (!conv.history.length) {
      logEl.innerHTML = '<p class="empty">Noch keine Nachrichten — leg unten los.</p>';
      return;
    }
    conv.history.forEach((m, idx) => {
      const div = document.createElement('div');
      div.className = 'msg ' + (m.role === 'user' ? 'user' : 'ai');
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = m.role === 'user' ? 'Du' : (m.provider || 'KI');
      div.appendChild(tag);
      const body = document.createElement('div');
      body.textContent = m.content;
      div.appendChild(body);

      const actions = document.createElement('div');
      actions.className = 'msg-actions';
      const mk = (label, fn) => {
        const b = document.createElement('button');
        b.textContent = label;
        b.addEventListener('click', fn);
        actions.appendChild(b);
      };
      mk('📋 Kopieren', () => navigator.clipboard.writeText(m.content));
      mk('🔊 Vorlesen', () => speak(m.content));
      mk('↗ Weiterleiten', () => {
        if (navigator.share) navigator.share({ text: m.content });
        else navigator.clipboard.writeText(m.content);
      });
      if (m.role === 'assistant') mk('↻ Neu generieren', () => regenerate(idx));
      div.appendChild(actions);
      logEl.appendChild(div);
    });
    logEl.scrollTop = logEl.scrollHeight;
  }

  async function regenerate(assistantIdx) {
    const conv = activeConv();
    conv.history = conv.history.slice(0, assistantIdx);
    renderLog();
    await requestReply();
  }

  // ---------- Senden ----------
  const sendBtn = document.getElementById('sendBtn');
  async function requestReply() {
    const conv = activeConv();
    const baseUrl = document.getElementById('baseUrl').value.trim().replace(/\/$/, '');
    const apiKey = document.getElementById('apiKey').value.trim();
    const chatPath = document.getElementById('chatPath').value.trim() || '/chat';
    if (!baseUrl) { railStatus.textContent = 'Bitte zuerst die Gateway-URL angeben.'; return; }

    sendBtn.disabled = true;
    pulse.classList.remove('run'); void pulse.offsetWidth; pulse.classList.add('run');
    railStatus.textContent = 'Anfrage unterwegs…';

    try {
      const resp = await fetch(baseUrl + chatPath, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...(apiKey ? { 'Authorization': 'Bearer ' + apiKey } : {}) },
        body: JSON.stringify({ messages: conv.history.map(m => ({ role: m.role, content: m.content })) })
      });
      if (!resp.ok) throw new Error('Server antwortete mit Status ' + resp.status);
      const data = await resp.json();
      const provider = data.provider || 'unbekannt';
      const text = data.text || JSON.stringify(data);
      markProvider(provider, ['gemini', 'groq', 'openrouter']);
      railStatus.textContent = 'Beantwortet von: ' + provider;
      conv.history.push({ role: 'assistant', content: text, provider });
      renderLog();
      if (voiceEnabled) speak(text);
    } catch (err) {
      resetRail();
      railStatus.textContent = 'Fehler: ' + err.message;
      conv.history.push({ role: 'assistant', content: 'Verbindung fehlgeschlagen: ' + err.message, provider: 'Fehler' });
      renderLog();
    } finally {
      sendBtn.disabled = false;
    }
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    const conv = activeConv();
    conv.history.push({ role: 'user', content: text });
    inputEl.value = '';
    renderLog();
    await requestReply();
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  // ---------- Initial ----------
  renderChatList();
  renderLog();
</script>

</body>
</html>
