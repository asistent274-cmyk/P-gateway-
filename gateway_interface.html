<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gateway Relay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #12141c;
    --panel: #1b1e2b;
    --panel-raised: #232739;
    --border: #2c3145;
    --signal: #ffb86b;
    --relay: #6c8ef5;
    --text: #e8e6e1;
    --muted: #8b8fa3;
    --danger: #ff6b6b;
    --ok: #7ee0b0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--border);
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .voice-toggle {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 44px;
    height: 44px;
    font-size: 18px;
    cursor: pointer;
    color: var(--text);
    transition: all 0.15s ease;
    flex-shrink: 0;
  }
  .voice-toggle[aria-pressed="true"] {
    background: var(--signal);
    border-color: var(--signal);
  }
  .voice-toggle:hover { filter: brightness(1.1); }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin: 0 0 6px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 28px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  h1 span { color: var(--signal); }

  /* --- Relay rail: signature element --- */
  .rail-wrap {
    padding: 28px 24px 8px;
    max-width: 760px;
    margin: 0 auto;
  }
  .rail {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 2px;
    background: var(--border);
    margin: 40px 0 14px;
  }
  .node {
    position: relative;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--panel-raised);
    border: 2px solid var(--border);
    transition: all 0.4s ease;
  }
  .node .label {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }
  .node.active {
    background: var(--signal);
    border-color: var(--signal);
    box-shadow: 0 0 0 6px rgba(255, 184, 107, 0.15);
  }
  .node.skipped {
    border-color: var(--danger);
    opacity: 0.4;
  }
  .pulse {
    position: absolute;
    top: -4px;
    left: 0;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--relay);
    opacity: 0;
  }
  .pulse.run {
    animation: travel 1.1s ease-in-out;
  }
  @keyframes travel {
    0% { left: 0%; opacity: 1; }
    100% { left: calc(100% - 10px); opacity: 1; }
  }
  .rail-status {
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    min-height: 18px;
  }

  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 12px 24px 40px;
  }

  .config {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .config summary {
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .config-fields {
    display: grid;
    gap: 10px;
    margin-top: 14px;
  }
  label {
    font-size: 12px;
    color: var(--muted);
    display: block;
    margin-bottom: 4px;
  }
  input[type=text], input[type=password] {
    width: 100%;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 10px;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }
  input:focus, textarea:focus, button:focus {
    outline: 2px solid var(--relay);
    outline-offset: 1px;
  }

  .log {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 200px;
    margin-bottom: 16px;
  }
  .msg {
    padding: 12px 14px;
    border-radius: 10px;
    max-width: 88%;
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
  }
  .msg.user {
    background: var(--panel-raised);
    align-self: flex-end;
    border: 1px solid var(--border);
  }
  .msg.ai {
    background: var(--panel);
    align-self: flex-start;
    border-left: 2px solid var(--signal);
  }
  .msg .tag {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .msg.error { border-left-color: var(--danger); }

  .composer {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14.5px;
    min-height: 48px;
  }
  button.send {
    background: var(--signal);
    color: #1a1305;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    height: 48px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  button.send:hover { filter: brightness(1.08); }
  button.send:disabled { opacity: 0.5; cursor: not-allowed; }

  .empty {
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    padding: 40px 0;
  }
</style>
</head>
<body>

<header class="header-row">
  <div>
    <p class="eyebrow">Eigenes Gateway · Fallback-Relay</p>
    <h1>Gateway<span>.</span>Relay</h1>
  </div>
  <button id="voiceToggle" class="voice-toggle" aria-pressed="false" title="Antworten vorlesen">
    <span id="voiceIcon">🔇</span>
  </button>
</header>

<div class="rail-wrap">
  <div class="rail" id="rail">
    <div class="pulse" id="pulse"></div>
    <div class="node" id="node-gemini"><span class="label">Gemini</span></div>
    <div class="node" id="node-groq"><span class="label">Groq</span></div>
    <div class="node" id="node-openrouter"><span class="label">OpenRouter</span></div>
  </div>
  <p class="rail-status" id="railStatus">Bereit — sende eine Nachricht, um zu sehen, welcher Anbieter antwortet</p>
</div>

<main>
  <details class="config">
    <summary>Verbindung einrichten</summary>
    <div class="config-fields">
      <div>
        <label for="baseUrl">Gateway-URL (deine Render-Adresse)</label>
        <input type="text" id="baseUrl" placeholder="https://dein-gateway.onrender.com">
      </div>
      <div>
        <label for="apiKey">Dein API-Key</label>
        <input type="password" id="apiKey" placeholder="owner- oder free-tier Key">
      </div>
      <div>
        <label for="chatPath">Chat-Endpunkt (Pfad, meist unverändert lassen)</label>
        <input type="text" id="chatPath" value="/chat">
      </div>
    </div>
  </details>

  <div class="log" id="log">
    <p class="empty">Noch keine Nachrichten — leg unten los.</p>
  </div>

  <div class="composer">
    <textarea id="input" placeholder="Frag dein Gateway etwas…" rows="2"></textarea>
    <button class="send" id="sendBtn">Senden</button>
  </div>
</main>

<script>
  const logEl = document.getElementById('log');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const railStatus = document.getElementById('railStatus');
  const pulse = document.getElementById('pulse');

  const nodes = {
    gemini: document.getElementById('node-gemini'),
    groq: document.getElementById('node-groq'),
    openrouter: document.getElementById('node-openrouter'),
  };

  let history = [];
  let voiceEnabled = false;

  const voiceToggle = document.getElementById('voiceToggle');
  const voiceIcon = document.getElementById('voiceIcon');
  const synth = window.speechSynthesis;

  function speak(text) {
    if (!voiceEnabled || !synth) return;
    synth.cancel(); // vorherige Sprachausgabe abbrechen, falls noch aktiv
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'de-DE';
    synth.speak(utter);
  }

  voiceToggle.addEventListener('click', () => {
    voiceEnabled = !voiceEnabled;
    voiceToggle.setAttribute('aria-pressed', String(voiceEnabled));
    voiceIcon.textContent = voiceEnabled ? '🔊' : '🔇';
    if (!voiceEnabled && synth) synth.cancel();
  });

  function resetRail() {
    Object.values(nodes).forEach(n => n.classList.remove('active', 'skipped'));
  }

  function markProvider(provider, triedOrder) {
    resetRail();
    for (const p of triedOrder) {
      if (p === provider) {
        nodes[p].classList.add('active');
        break;
      } else {
        nodes[p].classList.add('skipped');
      }
    }
  }

  function appendMessage(role, text, tag) {
    const empty = logEl.querySelector('.empty');
    if (empty) empty.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    if (tag) {
      const t = document.createElement('span');
      t.className = 'tag';
      t.textContent = tag;
      div.appendChild(t);
    }
    const body = document.createElement('div');
    body.textContent = text;
    div.appendChild(body);
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    const baseUrl = document.getElementById('baseUrl').value.trim().replace(/\/$/, '');
    const apiKey = document.getElementById('apiKey').value.trim();
    const chatPath = document.getElementById('chatPath').value.trim() || '/chat';

    if (!baseUrl) {
      railStatus.textContent = 'Bitte zuerst die Gateway-URL unter "Verbindung einrichten" angeben.';
      return;
    }

    appendMessage('user', text, 'Du');
    history.push({ role: 'user', content: text });
    inputEl.value = '';
    sendBtn.disabled = true;
    pulse.classList.remove('run');
    void pulse.offsetWidth;
    pulse.classList.add('run');
    railStatus.textContent = 'Anfrage unterwegs…';

    try {
      const resp = await fetch(baseUrl + chatPath, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(apiKey ? { 'Authorization': 'Bearer ' + apiKey } : {})
        },
        body: JSON.stringify({ messages: history })
      });

      if (!resp.ok) {
        throw new Error('Server antwortete mit Status ' + resp.status);
      }

      const data = await resp.json();
      const provider = data.provider || 'unbekannt';
      const text = data.text || JSON.stringify(data);

      markProvider(provider, ['gemini', 'groq', 'openrouter']);
      railStatus.textContent = 'Beantwortet von: ' + provider;
      appendMessage('ai', text, provider);
      history.push({ role: 'assistant', content: text });
      speak(text);

    } catch (err) {
      resetRail();
      railStatus.textContent = 'Fehler: ' + err.message;
      appendMessage('ai error', 'Verbindung fehlgeschlagen: ' + err.message, 'Fehler');
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>

</body>
</html>
